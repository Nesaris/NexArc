name: verification

# Chaque poussée, chaque demande de fusion et chaque lundi : les essais, les
# empreintes de ce qui est embarqué (socle, noVNC), l'analyse statique, les
# secrets de tout l'historique, l'identité des nouveaux commits et la liste d'anonymat. Aucune action
# tierce n'est suivie par étiquette : chacune est épinglée sur son commit.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  essais:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Essais
        run: npm test
      # L'agent : vérification TLS sur ses deux chemins, lecture de la posture.
      # Python du système, dans un environnement virtuel ; les dépendances que
      # reçoivent les postes, vérifiées par leurs empreintes.
      - name: Essais de l'agent
        run: |
          python3 -m venv "$RUNNER_TEMP/agent"
          "$RUNNER_TEMP/agent/bin/pip" install --quiet --require-hashes --prefer-binary -r agent/requirements.txt
          "$RUNNER_TEMP/agent/bin/python" -m unittest agent/test_agent.py -v
      - name: Essais du socle embarqué
        working-directory: socle
        run: node --disable-warning=ExperimentalWarning --test test/*.test.js
      - name: Socle embarqué conforme à ses empreintes
        working-directory: socle
        run: sha256sum --check --strict EMPREINTES
      - name: noVNC conforme à sa provenance
        working-directory: web/vendor/novnc
        run: |
          grep -E '^  [0-9a-f]{64}  ' PROVENANCE | while read -r somme _ fichier; do
            echo "$somme  $fichier" | sha256sum --check --strict
          done

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # L'outil en ligne de commande (licence MIT), et non l'action : celle-ci
      # exige une licence payante sur un dépôt d'organisation. Archive vérifiée
      # par son empreinte avant usage ; tout l'historique est balayé.
      - name: Aucun secret dans l'historique (gitleaks 8.30.1)
        env:
          VERSION: 8.30.1
          EMPREINTE: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "${EMPREINTE}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1

  identite:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Nouveaux commits, un seul auteur, en UTC, sans mention d'outil
        env:
          AVANT: ${{ github.event.pull_request.base.sha || github.event.before }}
          APRES: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "$AVANT^{commit}" 2>/dev/null; then AVANT=$(git rev-list --max-parents=0 "$APRES" | tail -n 1); fi
          plage="$AVANT..$APRES"
          auteurs=$(git log --format='%an <%ae>%n%cn <%ce>' "$plage" | sort -u)
          echo "$auteurs"
          if [ -n "$auteurs" ] && [ "$(printf '%s\n' "$auteurs" | wc -l)" -ne 1 ]; then echo "plusieurs identités"; exit 1; fi
          # UTC s'écrit « +00:00 » ou « Z » selon la version de git.
          if git log --format='%aI%n%cI' "$plage" | grep -vE '(\+00:00|Z)$'; then echo "fuseau autre que UTC"; exit 1; fi
          if git log --format='%B' "$plage" | grep -inE 'co-authored-by|generated (by|with)|as an ai|🤖|claude\.ai/code|session_[0-9A-Za-z]{10,}'; then echo "mention d'outil"; exit 1; fi

  anonymat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Aucun terme de la liste d'anonymat, dans l'arbre ni dans les nouveaux commits
        env:
          LISTE: ${{ secrets.LISTE_ANONYMAT }}
          AVANT: ${{ github.event.pull_request.base.sha || github.event.before }}
          APRES: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$LISTE" ]; then echo "Secret LISTE_ANONYMAT absent : contrôle impossible, refusé."; exit 1; fi
          # Une ligne par terme : tel quel, sans tenir compte de la casse ;
          # « =terme » en respectant la casse ; « ~terme » en mot entier
          # (un mot courant qui se retrouve dans d'autres mots).
          sans_casse=$(mktemp); casse=$(mktemp); mots=$(mktemp)
          printf '%s\n' "$LISTE" | sed '/^[[:space:]]*$/d' | grep -v '^[=~]' > "$sans_casse" || true
          printf '%s\n' "$LISTE" | sed -n 's/^=//p' | sed '/^[[:space:]]*$/d' > "$casse" || true
          printf '%s\n' "$LISTE" | sed -n 's/^~//p' | sed '/^[[:space:]]*$/d' > "$mots" || true
          cherche() { t=$(mktemp); cat > "$t"; { [ -s "$sans_casse" ] && grep -qiF -f "$sans_casse" "$t"; } || { [ -s "$casse" ] && grep -qF -f "$casse" "$t"; } || { [ -s "$mots" ] && grep -qiwF -f "$mots" "$t"; }; }
          if git grep -hI -e '' -- . ':!web/vendor' | cherche; then echo "Un terme de la liste figure dans l'arbre."; exit 1; fi
          if ! git cat-file -e "$AVANT^{commit}" 2>/dev/null; then AVANT=$(git rev-list --max-parents=0 "$APRES" | tail -n 1); fi
          if { git log --format='%an%n%ae%n%cn%n%ce%n%B' "$AVANT..$APRES"; git log -p --format= "$AVANT..$APRES" | grep '^+'; } | cherche; then echo "Un terme de la liste figure dans les nouveaux commits."; exit 1; fi
          echo "Aucune correspondance."

  analyse:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript, python
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
